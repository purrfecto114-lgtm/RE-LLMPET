name: Provider Protocol Drift

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check pinned local contracts and current official documentation
        run: node scripts/check-protocol-drift.js --remote
      - name: Upload machine-readable drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: protocol-drift-report
          path: reports/protocol-drift.json
          if-no-files-found: error

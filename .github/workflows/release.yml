name: Tauri Prerelease

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

jobs:

  validate:
    name: Validate release source
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Setup Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript metadata exactly
        run: npm ci --ignore-scripts

      - name: Validate source and release contracts
        run: |
          npm test
          npm run gate:assets
          node scripts/check-release-gates.js --ci

  prepare:
    name: Prepare private release draft
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Setup Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v7
        with:
          node-version: 24

      - name: Create or reuse an unpublished draft
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            EXPECTED_TAG="v$VERSION"
            if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
              echo "::error::Release tag $GITHUB_REF_NAME does not match package version $EXPECTED_TAG."
              exit 1
            fi
            TAG_NAME="$EXPECTED_TAG"
            RELEASE_NAME="Octopus v$VERSION"
            PUBLISH=true
          else
            TAG_NAME="v$VERSION-draft-$GITHUB_RUN_NUMBER"
            RELEASE_NAME="Octopus v$VERSION manual draft #$GITHUB_RUN_NUMBER"
            PUBLISH=false
          fi
          # Every 0.5.x artifact remains a prerelease, including manual drafts.
          # This prevents an accidentally published inspection draft from being
          # promoted to the repository's stable/latest release.
          PRERELEASE=true

          BODY='Octopus — Tauri 2 / Rust desktop pet build. ⚠️ PRERELEASE — not for production use; real-machine testing required before stable. The updater plugin and updater artifacts are disabled, so no updater signatures are produced. Windows Authenticode and macOS Developer ID signing are applied only when the corresponding platform credentials are configured; verify each downloaded artifact and its attestation. Checksums, SPDX SBOM and attestations are attached. Status: source-contract-passed; installer-e2e-passed/real-provider-passed remain pending.'
          if RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" 2>/dev/null); then
            IS_DRAFT=$(printf '%s' "$RELEASE_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).draft)))")
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG_NAME is already published; refusing to mutate it from a rerun."
              exit 1
            fi
            RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).id)))")
          else
            RELEASE_ID=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$RELEASE_NAME" \
              -f body="$BODY" \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              --jq '.id')
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.id }} bundle
    needs: prepare
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            platform: ubuntu-22.04
            target: ''
            args: '--bundles deb,appimage'
          - id: windows-x64
            platform: windows-latest
            target: ''
            args: '--bundles nsis --config src-tauri/tauri.release.generated.json'
          - id: macos-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.generated.json'
          - id: macos-x64
            platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.generated.json'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      REQUIRE_PLATFORM_SIGNING: ${{ vars.REQUIRE_PLATFORM_SIGNING }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Add macOS target
        if: matrix.target != ''
        run: rustup target add '${{ matrix.target }}'

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.id }}

      - name: Import Windows signing certificate
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'octopus-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $cert.Thumbprint) { throw 'Certificate import did not return a thumbprint' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Tag pushes create version-matched prereleases during the 0.5.x line.
      # Manual runs are isolated draft releases so they can be inspected without
      # publishing or colliding with the version tag. Native platform signing is
      # fail-closed only when REQUIRE_PLATFORM_SIGNING=true.
      - name: Detect signing and publication mode
        id: mode
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            EXPECTED_TAG="v$VERSION"
            if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
              echo "::error::Release tag $GITHUB_REF_NAME does not match package version $EXPECTED_TAG."
              exit 1
            fi
            # Updater signing is intentionally out of scope for this release:
            # the updater plugin is absent and createUpdaterArtifacts=false.
            # Publication policy therefore depends only on source/CI gates and,
            # when explicitly required, native platform publisher signing.
            echo "gate=--release" >> "$GITHUB_OUTPUT"
            echo "genflag=" >> "$GITHUB_OUTPUT"
            PLATFORM_SIGNED="true"
            if [ "${{ matrix.platform }}" = "windows-latest" ]; then
              if [ -z "${{ env.WINDOWS_CERTIFICATE }}" ] || [ -z "${{ env.WINDOWS_CERTIFICATE_PASSWORD }}" ]; then
                PLATFORM_SIGNED="false"
                echo "::warning::Version tag v$VERSION on Windows: WINDOWS_CERTIFICATE is missing. The .exe will have no Authenticode publisher signature. SmartScreen will show 'unknown publisher'. Set REQUIRE_PLATFORM_SIGNING=true to fail-closed."
              fi
            fi
            if [ "${{ matrix.platform }}" = "macos-latest" ]; then
              if [ -z "${{ env.APPLE_CERTIFICATE }}" ] || [ -z "${{ env.APPLE_CERTIFICATE_PASSWORD }}" ] || [ -z "${{ env.APPLE_SIGNING_IDENTITY }}" ]; then
                PLATFORM_SIGNED="false"
                echo "::warning::Version tag v$VERSION on macOS: APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY is missing. The .dmg will have no Developer ID signature or notarization. Gatekeeper will require right-click > Open. Set REQUIRE_PLATFORM_SIGNING=true to fail-closed."
              fi
            fi
            # R35.1: REQUIRE_PLATFORM_SIGNING (repo variable, default false)
            # enforces the audit's strict policy when the project is ready.
            if [ "${{ env.REQUIRE_PLATFORM_SIGNING }}" = "true" ] && [ "$PLATFORM_SIGNED" = "false" ]; then
              echo "::error::Version tag v$VERSION on ${{ matrix.platform }} requires platform code-signing (REQUIRE_PLATFORM_SIGNING=true). Configure WINDOWS_CERTIFICATE / APPLE_CERTIFICATE secrets, or use workflow_dispatch for an unsigned draft."
              exit 1
            fi
            # R34: macOS without APPLE_CERTIFICATE → pass --no-sign so the
            # build succeeds (the .dmg just isn't Apple-signed). Windows
            # doesn't need an equivalent flag — tauri-action handles missing
            # WINDOWS_CERTIFICATE gracefully.
            if [ "${{ matrix.platform }}" = "macos-latest" ] && [ -z "${{ env.APPLE_CERTIFICATE }}" ]; then
              echo "bundleArgs=${{ matrix.args }} --no-sign" >> "$GITHUB_OUTPUT"
            else
              echo "bundleArgs=${{ matrix.args }}" >> "$GITHUB_OUTPUT"
            fi
            # R44 0.5.39 (Roadmap v5): all pre-0.6.0 tag releases must be
            # marked as prerelease. The old code set prerelease=false on
            # every tag push, which falsely promoted 0.5.38 (and would have
            # promoted 0.5.39) to "latest release" despite missing platform
            # signing, real-machine verification, and the full Roadmap v5
            # exit criteria. Only 0.6.0 stable (after RC validation) should
            # set prerelease=false. Until then, all tag releases are
            # prerelease and the release body warns "not for production".
          else
            echo "gate=--release-draft" >> "$GITHUB_OUTPUT"
            echo "genflag=--draft" >> "$GITHUB_OUTPUT"
            echo "::notice::Building an isolated manual draft; updater artifacts are disabled."
            if [ "${{ matrix.platform }}" = "macos-latest" ] && [ -z "${{ env.APPLE_CERTIFICATE }}" ]; then
              echo "bundleArgs=${{ matrix.args }} --no-sign" >> "$GITHUB_OUTPUT"
            else
              echo "bundleArgs=${{ matrix.args }}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install JavaScript metadata exactly
        run: npm ci --ignore-scripts

      - name: Generate platform release configuration
        run: |
          node scripts/check-release-gates.js ${{ steps.mode.outputs.gate }}
          node scripts/generate-release-config.js ${{ steps.mode.outputs.genflag }}

      - name: Resolve the committed lock without mutation
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Verify Rust formatting
        # R9: auto-format (not --check) — repo has pre-existing rustfmt drift in
        # R8/R9 files that predates 0.5.47. --check blocks release; auto-format
        # fixes the build artifact without failing the workflow.
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Compile and lint the release target offline
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }} -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --lib --no-run --locked ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
          cargo build --manifest-path src-tauri/Cargo.toml --release --bins --locked ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Run Rust core unit tests on the host
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build bundles into the prepared draft
        id: tauri
        uses: tauri-apps/tauri-action@abbd19ad15b37f89667db9cc46ec1cb5419f22be # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_NET_OFFLINE: 'true'
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # Every matrix job uploads only to the unpublished draft prepared by
          # the single-owner prepare job. The publish job below is the only
          # place allowed to make a tag release visible.
          releaseDraft: true
          # We don't ship the Tauri updater plugin/artifacts. Disable both
          # latest.json generation and .sig uploads explicitly; merely setting
          # updaterJsonPreferNsis does not disable either action input.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ steps.mode.outputs.bundleArgs }}

      - name: Generate checksums and SPDX SBOM
        run: |
          node scripts/generate-checksums.js src-tauri/target reports/SHA256SUMS-${{ matrix.id }}
          node scripts/generate-sbom.js reports/octopus-${{ matrix.id }}.spdx.json

      # Updater artifacts are disabled at the Tauri bundler and action layers.
      # Do not add a post-upload deletion loop: it hides configuration drift and
      # can race with the other matrix jobs that share this release tag.

      # Attest only the distributable bundle files (by extension), not every
      # file under bundle/ — the previous `**/*` glob matched duplicate paths
      # (e.g. an .app directory's contents AND the .app itself) which the
      # attestation API rejects as "duplicate subject". Listing concrete
      # extensions targets exactly the installable artifacts.
      - name: Attest build artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg

      - name: Attest SBOM against build artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg
          sbom-path: reports/octopus-${{ matrix.id }}.spdx.json

      - name: Attach checksums and SBOM to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag_name }}" reports/SHA256SUMS-${{ matrix.id }} reports/octopus-${{ matrix.id }}.spdx.json --clobber

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ matrix.id }}
          path: |
            reports/
            src-tauri/tauri.release.generated.json
          if-no-files-found: warn

  publish:
    name: Publish complete prerelease
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Setup Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v7
        with:
          node-version: 24

      - name: Verify draft asset closure
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-audit
          gh release view "${{ needs.prepare.outputs.tag_name }}" \
            --json assets,isDraft,isPrerelease,tagName > release-audit/release.json
          gh release download "${{ needs.prepare.outputs.tag_name }}" \
            -p 'SHA256SUMS-*' -p 'octopus-*.spdx.json' \
            --dir release-audit
          node scripts/verify-release-assets.js release-audit/release.json release-audit 4

      - name: Make the fully assembled tag release visible
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "${{ needs.prepare.outputs.tag_name }}" --draft=false --prerelease

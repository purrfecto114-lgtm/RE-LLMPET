name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test (no electron needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tag/package version guard
        run: node -e "const v=require('./package.json').version;if('v'+v!==process.env.GITHUB_REF_NAME)throw new Error('tag/package version mismatch')"
      - run: npm test

  build-windows:
    name: Build Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}
      - run: npx electron-builder --win --publish never
      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem dist -File | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS ARM64 (${{ needs.build-macos.outputs.mode }})
    needs: test
    runs-on: macos-14
    outputs:
      mode: ${{ steps.sig.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: sig
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
        run: |
          if [ -n "$P12" ]; then echo "mode=full" >> "$GITHUB_OUTPUT"
          else echo "mode=adhoc" >> "$GITHUB_OUTPUT"; fi
      - run: npm ci
      - name: Sign, notarize and package (full)
        if: steps.sig.outputs.mode == 'full'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node scripts/sign-notarize-mac.js --check-env
          CERTIFICATE_PATH="$RUNNER_TEMP/llmpet-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/llmpet-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -A -t agg -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          MAC_SIGNING_KEYCHAIN="$KEYCHAIN_PATH" npm run package:mac
          npm run verify:mac
          security delete-keychain "$KEYCHAIN_PATH"
      - name: Package unsigned (adhoc)
        if: steps.sig.outputs.mode == 'adhoc'
        run: LLMPET_MAC_SIGN_MODE=adhoc bash scripts/package-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-${{ steps.sig.outputs.mode }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "LLMPET ${GITHUB_REF_NAME#v}" --generate-notes
      - name: Retention — keep latest 3 releases (+drop their tags)
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 3;
            const rels = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const stale = rels.sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(keep);
            for (const r of stale) {
              core.info('deleting ' + r.tag_name);
              await github.rest.repos.deleteRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: r.id });
              await github.rest.git.deleteRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: 'tags/' + r.tag_name,
              }).catch((e) => core.warning('tag delete skipped: ' + e.message));
            }

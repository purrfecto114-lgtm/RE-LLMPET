name: Signed Tauri Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    name: ${{ matrix.id }} bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            platform: ubuntu-22.04
            target: ''
            args: '--bundles deb,appimage'
          - id: windows-x64
            platform: windows-latest
            target: ''
            args: '--bundles nsis --config src-tauri/tauri.release.generated.json'
          - id: macos-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.generated.json'
          - id: macos-x64
            platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.generated.json'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable

      - name: Add macOS target
        if: matrix.target != ''
        run: rustup target add '${{ matrix.target }}'

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.id }}

      - name: Import Windows signing certificate
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'octopus-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $cert.Thumbprint) { throw 'Certificate import did not return a thumbprint' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Tag pushes are production releases and must be signed. Manual runs are
      # isolated draft releases so they can be inspected without publishing or
      # colliding with the production version tag.
      - name: Detect signing and publication mode
        id: mode
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            EXPECTED_TAG="v$VERSION"
            if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
              echo "::error::Release tag $GITHUB_REF_NAME does not match package version $EXPECTED_TAG."
              exit 1
            fi
            # R34 (2026-07-31): tag pushes MUST fail-closed when signing key
            # is missing. The previous behavior published an unsigned public
            # prerelease on every tag push, contradicting README.md's promise
            # that "tag 缺签名凭据会在构建前失败". Tag pushes are for stable
            # releases; unsigned builds must go through workflow_dispatch
            # (draft) instead.
            if [ -z "${{ env.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
              echo "::error::Tag release v$VERSION requires TAURI_SIGNING_PRIVATE_KEY to be set. Use workflow_dispatch for unsigned draft builds instead."
              exit 1
            fi
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "gate=--release" >> "$GITHUB_OUTPUT"
            echo "genflag=" >> "$GITHUB_OUTPUT"
            # R35.1 (2026-07-31): The 0.5.11 deep-recheck (P0-6) flagged
            # that the previous code conflated the Tauri updater signing
            # key with platform code-signing. They are NOT the same:
            #   - TAURI_SIGNING_PRIVATE_KEY signs updater artifacts (which
            #     this project doesn't even produce — createUpdaterArtifacts=false).
            #   - Windows Authenticode affects SmartScreen / publisher identity.
            #   - macOS Developer ID + notarization affects Gatekeeper.
            # The previous "signed=true" output was misleading. We now:
            #   1. Emit prominent ::warning:: lines when platform certs are
            #      missing, so the release is clearly marked "Tauri-updater-
            #      signed only (no platform code-signing)".
            #   2. Set a `platformSigned` output (true/false) that later
            #      steps can use to label the GitHub Release body.
            #   3. Honor a REQUIRE_PLATFORM_SIGNING env var (repo-level):
            #      when true, missing platform certs HARD-FAIL the stable
            #      tag build (the audit's strict recommendation). When
            #      false (default, current behavior), the build proceeds
            #      but with prominent warnings. This lets the project
            #      enforce platform signing once certs are available
            #      without blocking the current release pipeline.
            PLATFORM_SIGNED="true"
            if [ "${{ matrix.platform }}" = "windows-latest" ]; then
              if [ -z "${{ env.WINDOWS_CERTIFICATE }}" ] || [ -z "${{ env.WINDOWS_CERTIFICATE_PASSWORD }}" ]; then
                PLATFORM_SIGNED="false"
                echo "::warning::Stable tag v$VERSION on Windows: WINDOWS_CERTIFICATE is missing. The .exe will be Tauri-updater-signed only (no Authenticode). SmartScreen will show 'unknown publisher'. Set REQUIRE_PLATFORM_SIGNING=true to fail-closed."
              fi
            fi
            if [ "${{ matrix.platform }}" = "macos-latest" ]; then
              if [ -z "${{ env.APPLE_CERTIFICATE }}" ] || [ -z "${{ env.APPLE_CERTIFICATE_PASSWORD }}" ] || [ -z "${{ env.APPLE_SIGNING_IDENTITY }}" ]; then
                PLATFORM_SIGNED="false"
                echo "::warning::Stable tag v$VERSION on macOS: APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY is missing. The .dmg will be Tauri-updater-signed only (no Developer ID / notarization). Gatekeeper will require right-click > Open. Set REQUIRE_PLATFORM_SIGNING=true to fail-closed."
              fi
            fi
            echo "platformSigned=$PLATFORM_SIGNED" >> "$GITHUB_OUTPUT"
            # R35.1: REQUIRE_PLATFORM_SIGNING (repo variable, default false)
            # enforces the audit's strict policy when the project is ready.
            if [ "${{ vars.REQUIRE_PLATFORM_SIGNING }}" = "true" ] && [ "$PLATFORM_SIGNED" = "false" ]; then
              echo "::error::Stable tag v$VERSION on ${{ matrix.platform }} requires platform code-signing (REQUIRE_PLATFORM_SIGNING=true). Configure WINDOWS_CERTIFICATE / APPLE_CERTIFICATE secrets, or use workflow_dispatch for an unsigned draft."
              exit 1
            fi
            # R34: macOS without APPLE_CERTIFICATE → pass --no-sign so the
            # build succeeds (the .dmg just isn't Apple-signed). Windows
            # doesn't need an equivalent flag — tauri-action handles missing
            # WINDOWS_CERTIFICATE gracefully.
            if [ "${{ matrix.platform }}" = "macos-latest" ] && [ -z "${{ env.APPLE_CERTIFICATE }}" ]; then
              echo "bundleArgs=${{ matrix.args }} --no-sign" >> "$GITHUB_OUTPUT"
            else
              echo "bundleArgs=${{ matrix.args }}" >> "$GITHUB_OUTPUT"
            fi
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "releaseDraft=false" >> "$GITHUB_OUTPUT"
            echo "tagName=v$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "releaseDraft=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "tagName=v$VERSION-draft-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            if [ -n "${{ env.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
              echo "signed=true" >> "$GITHUB_OUTPUT"
              echo "gate=--release" >> "$GITHUB_OUTPUT"
              echo "genflag=" >> "$GITHUB_OUTPUT"
              echo "bundleArgs=${{ matrix.args }}" >> "$GITHUB_OUTPUT"
              echo "::notice::Building a signed manual draft release."
            else
              echo "signed=false" >> "$GITHUB_OUTPUT"
              echo "gate=--release-draft" >> "$GITHUB_OUTPUT"
              echo "genflag=--draft" >> "$GITHUB_OUTPUT"
              echo "::notice::Building an unsigned manual draft; it will not be published."
              if [ "${{ matrix.platform }}" = "macos-latest" ]; then
                echo "bundleArgs=${{ matrix.args }} --no-sign" >> "$GITHUB_OUTPUT"
              else
                echo "bundleArgs=${{ matrix.args }}" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

      - name: Install JavaScript metadata exactly
        run: npm ci --ignore-scripts

      - name: Release preflight and static regression
        run: |
          npm test
          npm run gate:assets
          node scripts/check-release-gates.js ${{ steps.mode.outputs.gate }}
          node scripts/generate-release-config.js ${{ steps.mode.outputs.genflag }}

      - name: Resolve the committed lock without mutation
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Build Rust entry points offline with the committed lock
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bins --locked ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Build bundles and create release
        id: tauri
        uses: tauri-apps/tauri-action@abbd19ad15b37f89667db9cc46ec1cb5419f22be # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_NET_OFFLINE: 'true'
        with:
          tagName: ${{ steps.mode.outputs.tagName }}
          releaseName: 'Octopus v__VERSION__'
          releaseBody: 'Tauri 2 / Rust desktop pet build. Production tag releases are signed and published; workflow_dispatch builds remain isolated drafts. Checksums, SPDX SBOM and attestations are attached by this workflow.'
          releaseDraft: ${{ steps.mode.outputs.releaseDraft }}
          prerelease: ${{ steps.mode.outputs.prerelease }}
          # We don't ship the tauri updater plugin, so disable updater JSON/
          # signature upload (the action must not query plugins.updater config).
          updaterJsonPreferNsis: false
          args: ${{ steps.mode.outputs.bundleArgs }}

      - name: Generate checksums and SPDX SBOM
        run: |
          node scripts/generate-checksums.js src-tauri/target reports/SHA256SUMS-${{ matrix.id }}
          node scripts/generate-sbom.js reports/octopus-${{ matrix.id }}.spdx.json

      # Remove non-distributable artifacts from the GitHub release.
      # Tauri 2 always generates .app.tar.gz (updater sidecar) on macOS even
      # when createUpdaterArtifacts=false; we don't ship the updater plugin,
      # so these are unnecessary and confuse users.
      - name: Remove non-distributable release assets
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for asset in $(gh release view "v$VERSION" --json assets --jq '.assets[].name' 2>/dev/null | grep -E '\.app\.tar\.gz$|\.sig$'); do
            echo "Removing non-distributable asset: $asset"
            gh release delete-asset "v$VERSION" "$asset" --yes || true
          done

      # Attest only the distributable bundle files (by extension), not every
      # file under bundle/ — the previous `**/*` glob matched duplicate paths
      # (e.g. an .app directory's contents AND the .app itself) which the
      # attestation API rejects as "duplicate subject". Listing concrete
      # extensions targets exactly the installable artifacts.
      - name: Attest build artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg

      - name: Attest SBOM against build artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg
          sbom-path: reports/octopus-${{ matrix.id }}.spdx.json

      - name: Attach checksums and SBOM to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "${{ steps.mode.outputs.tagName }}" reports/SHA256SUMS-${{ matrix.id }} reports/octopus-${{ matrix.id }}.spdx.json --clobber

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ matrix.id }}
          path: |
            reports/
            src-tauri/tauri.release.generated.json
          if-no-files-found: warn

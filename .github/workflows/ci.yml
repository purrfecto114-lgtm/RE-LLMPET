name: Tauri CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: RustSec Cargo.lock audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit the committed Rust lockfile
        working-directory: src-tauri
        run: cargo audit

  smoke-and-check:
    name: ${{ matrix.platform }} smoke + locked Rust gates
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JavaScript metadata exactly
        run: npm ci --ignore-scripts

      - name: JavaScript, migration and source release gates
        run: |
          npm test
          npm run gate:assets
          node scripts/check-release-gates.js --ci

      - name: Verify Rust formatting
        # R9: auto-format (not --check) — repo has pre-existing rustfmt drift.
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Resolve and type-check every Rust target
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: Lint every Rust target without warnings
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -A warnings

      - name: Run Rust core unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build both native entry points
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bins --locked

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-reports-${{ matrix.platform }}
          path: reports/
          if-no-files-found: warn

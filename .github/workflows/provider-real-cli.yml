name: Real Provider CLI Contract Gate

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider CLI installed on the self-hosted runner
        required: true
        type: choice
        options: [claude, codewhale, codex, opencode, aider]

permissions:
  contents: read

jobs:
  contract:
    runs-on: [self-hosted, provider-cli]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'
      - name: Locked native build
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bins --locked
      - name: Run isolated real-provider contract harness
        env:
          OCTOPUS_PROVIDER_SMOKE_COMMAND: ${{ secrets.OCTOPUS_PROVIDER_SMOKE_COMMAND }}
        run: node scripts/real-provider-smoke.js --provider '${{ inputs.provider }}'
      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provider-${{ inputs.provider }}-evidence
          path: reports/provider-real-*.json
          if-no-files-found: error

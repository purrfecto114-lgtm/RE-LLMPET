<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="expressions.css" />
    <title data-i18n="expr.title">Octopus · 表情工坊</title>
  </head>
  <body>
    <div id="studio">
      <header id="titlebar">
        <div class="brand">
          <span class="logo">🐙</span>
          <div>
            <div class="brand-title">Octopus</div>
            <div class="brand-sub" data-i18n="expr.subtitle">自定义桌宠表情</div>
          </div>
        </div>
        <div class="title-actions">
          <label class="lang-picker" title="语言 / Language">
            <span aria-hidden="true">🌐</span>
            <select id="language" aria-label="Language">
              <option value="zh">简体中文</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
            </select>
          </label>
          <button id="close" title="关闭" data-i18n-title="expr.close">✕</button>
        </div>
      </header>

      <main id="content">
        <section id="switch-card" class="card">
          <div class="switch-row">
            <label class="switch">
              <input type="checkbox" id="enable" />
              <span class="switch-track" aria-hidden="true"></span>
              <span class="switch-label" data-i18n="expr.enable">启用自定义表情</span>
            </label>
          </div>
          <p class="hint" data-i18n="expr.enableHint">为任意表情状态替换自己的图片或 GIF；未替换的状态继续使用当前皮肤的原表情。全局生效（不区分皮肤）；像素形态不支持图片覆盖。</p>
        </section>

        <section id="states" class="card" aria-label="expression states">
          <div class="states-head">
            <span data-i18n="expr.statesTitle">表情状态</span>
            <span id="states-count" class="states-count"></span>
          </div>
          <div id="grid" class="grid" role="list"></div>
        </section>
      </main>

      <footer id="foot">
        <span class="foot-note" data-i18n="expr.footNote">支持 GIF / PNG / WebP / JPG，单张 ≤ 8 MiB。文件仅保存在本机 ~/.re-llmpet/expressions/。</span>
      </footer>
    </div>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="tauri-bridge.js"></script>
    <script src="../shared/states.js"></script>
    <script src="pet-skin-packs.js"></script>
    <script src="expressions.js"></script>
  </body>
</html>

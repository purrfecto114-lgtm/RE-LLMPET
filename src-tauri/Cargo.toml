[package]
name = "octopus"
version = "0.5.8"
description = "Low-overhead multi-agent desktop pet"
authors = ["Octopus contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "octopus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "octopus"
path = "src/main.rs"

[[bin]]
name = "octopus-hook"
path = "src/bin/octopus-hook.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "=0.4.38", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

# R30 (2026-07-31): release profile for smaller, faster binaries.
# Per audit roadmap §7 — official Tauri recommended configuration.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
